<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2"/>

  <!-- Subtle glow layer behind chart -->
  <circle cx="128" cy="138" r="64" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Chart Grid Lines -->
  <line x1="56" y1="184" x2="200" y2="184" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="144" x2="200" y2="144" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <line x1="56" y1="104" x2="200" y2="104" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Bar 1 -->
  <rect x="68" y="128" width="24" height="56" rx="6" fill="url(#barGrad1)"/>
  <!-- Bar 2 -->
  <rect x="104" y="96" width="24" height="88" rx="6" fill="url(#barGrad2)"/>
  <!-- Bar 3 -->
  <rect x="140" y="68" width="24" height="116" rx="6" fill="url(#barGrad3)"/>

  <!-- Trend Curve Line & Points -->
  <path d="M 80 118 Q 116 88 152 60 T 188 52" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="118" r="4.5" fill="#f43f5e" stroke="#18181b" stroke-width="2"/>
  <circle cx="116" cy="85" r="4.5" fill="#f43f5e" stroke="#18181b" stroke-width="2"/>
  <circle cx="152" cy="60" r="4.5" fill="#f43f5e" stroke="#18181b" stroke-width="2"/>
  <circle cx="188" cy="52" r="5" fill="#fb7185" stroke="#18181b" stroke-width="2"/>

  <!-- Database / Storage Chip Emblem -->
  <g transform="translate(172, 140)">
    <rect width="36" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <ellipse cx="18" cy="10" rx="12" ry="5" fill="#3b82f6"/>
    <path d="M 6 10 v 10 c 0 3 6 5 12 5 s 12 -2 12 -5 v -10" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <path d="M 6 20 v 10 c 0 3 6 5 12 5 s 12 -2 12 -5 v -10" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
</svg>
